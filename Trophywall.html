<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trophy Wall — GLF Season XV</title>
<style>
    body { margin:0;background:#0a0a0a;color:#f7e7c1;font-family:Georgia,serif; }
    header { text-align:center;padding:60px;background:linear-gradient(180deg,#1a1a1a,#000); }
    h1 { font-size:54px;color:#d4af37;text-transform:uppercase; }
    .wall { max-width:1000px;margin:auto;padding:40px; }
    .award { margin-bottom:40px;padding:25px;border-radius:14px;background:rgba(20,20,20,0.85);
             border:1px solid rgba(255,255,255,0.06);box-shadow:0 12px 40px rgba(0,0,0,0.55); }
    h2 { color:#d4af37;font-size:32px;margin-bottom:10px; }
</style>
</head>

<body>
<header><h1>Trophy Wall</h1></header>

<div class="wall">

    <div class="award">
        <h2>Champions</h2>
        <p>Season XIV — Kris Cappiello</p>
        <p>Season XIII — Collin Wilson</p>
        <p>Season XII — Brandon</p>
    </div>

    <div class="award">
        <h2>Golden High Point Winners</h2>
        <p>Season XIV — Josh (178 pts)</p>
        <p>Season XIII — Dan (165 pts)</p>
    </div>

</div>

</body>
</html>
