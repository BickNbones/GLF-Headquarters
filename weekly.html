<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GFL Weekly Hub</title>
  <style>
    body{margin:0;background:#05050a;color:#fff;font-family:Segoe UI,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
    main{max-width:720px;padding:32px;border:1px solid #2a2a40;border-radius:12px;background:#0e0e1a;text-align:center}
    h1{color:#f5a623} button{background:#f5a623;color:#05050a;border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer}
    #status{color:#aaaac0;white-space:pre-wrap}.error{color:#ff8080}
  </style>
</head>
<body>
<main>
  <h1>⚡ GFL WEEKLY HUB</h1>
  <p id="status">Loading weekly.txt…</p>
  <input id="pick" type="file" accept=".txt,text/plain" hidden>
  <button id="choose" type="button" hidden>Select weekly.txt</button>
</main>
<script>
(function(){
  const status=document.getElementById('status');
  const pick=document.getElementById('pick');
  const choose=document.getElementById('choose');

  function decodeEscapedHtml(text){
    let s=text.replace(/^\uFEFF/, '').trim();
    // Remove the display-layer escaping found in the supplied weekly.txt.
    s=s.replace(/\\([<>\[\]|*_])/g,'$1');
    s=s.replace(/=\\>/g,'=>').replace(/\\</g,'<').replace(/\\>/g,'>');
    return s;
  }
  function launch(text){
    const html=decodeEscapedHtml(text);
    if(!/^<!DOCTYPE html>|^<html/i.test(html)) throw new Error('The selected file does not begin with HTML markup.');
    document.open(); document.write(html); document.close();
  }
  function manual(message){
    status.textContent=message+'\nChoose the original weekly.txt file to open the restored hub.';
    status.className='error'; choose.hidden=false;
  }
  choose.addEventListener('click',()=>pick.click());
  pick.addEventListener('change',()=>{
    const file=pick.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{try{launch(String(reader.result))}catch(e){manual(e.message)}};
    reader.onerror=()=>manual('Could not read weekly.txt.');
    reader.readAsText(file,'utf-8');
  });
  fetch('weekly.txt',{cache:'no-store'})
    .then(r=>{if(!r.ok) throw new Error('weekly.txt was not found beside weekly.html.');return r.text()})
    .then(launch)
    .catch(e=>manual(e.message));
})();
</script>
</body>
</html>
